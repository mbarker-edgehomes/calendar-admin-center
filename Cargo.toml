[package]
name = "calendar-admin-center"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A native, delegated Exchange Online calendar administration desktop"
publish = false

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
lto = "thin"
strip = true

