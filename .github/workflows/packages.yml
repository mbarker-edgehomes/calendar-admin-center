name: Package native apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --locked --release
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p 'dist/Calendar Admin Center.app/Contents/MacOS'
          cp target/release/calendar-admin-center 'dist/Calendar Admin Center.app/Contents/MacOS/'
          cp packaging/Info.plist 'dist/Calendar Admin Center.app/Contents/'
          cp README.md LICENSE dist/
          tar -czf calendar-admin-center-macOS.tar.gz -C dist .
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/calendar-admin-center README.md LICENSE dist/
          tar -czf calendar-admin-center-Linux.tar.gz -C dist .
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/release/calendar-admin-center.exe,README.md,LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath calendar-admin-center-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}-${{ runner.arch }}
          path: |
            calendar-admin-center-*.tar.gz
            calendar-admin-center-*.zip
          if-no-files-found: error
