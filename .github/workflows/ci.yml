name: Native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: PowerShell broker tests (stub Exchange service)
        env:
          CAC_PWSH: pwsh
        run: cargo test --locked broker -- --ignored
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-admin-center-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/calendar-admin-center
            target/release/calendar-admin-center.exe
          if-no-files-found: error
